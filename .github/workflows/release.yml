name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
      - run: uv sync --locked --extra dev
      - run: uv run pytest
      - run: uv run ruff check src tests scripts mcpb
      - run: uv run ruff format --check src tests scripts mcpb
      - run: uv run python scripts/check_release.py
      - run: uv build --out-dir dist/python
      - name: Build and validate Mac extension
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            uv run python scripts/build_mcpb.py --tag "$GITHUB_REF_NAME"
          else
            uv run python scripts/build_mcpb.py
          fi
      - run: uv run python scripts/check_mcpb.py dist/mcpb
      - uses: actions/upload-artifact@v6
        with:
          name: python-dist
          path: dist/python/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        with:
          name: mac-extension
          path: dist/mcpb/*
          if-no-files-found: error
  publish-pypi:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/flin-bigquery-mcp
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
  publish-github:
    needs: [build, publish-pypi]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: release-assets
      - uses: actions/download-artifact@v8
        with:
          name: mac-extension
          path: release-assets
      - name: Publish release downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release-assets/* --verify-tag --title "$RELEASE_TAG" --generate-notes
