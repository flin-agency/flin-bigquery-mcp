name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: '3.12'
      - run: uv sync --locked --extra dev
      - name: Verify native Apple Silicon runtime
        run: uv run python -c "import platform; assert platform.system() == 'Darwin' and platform.machine() == 'arm64'; print(platform.platform())"
      - name: Audit locked dependencies
        shell: bash
        run: |
          uv export --locked --no-dev --no-emit-project --format requirements-txt --output-file audit-requirements.txt --quiet
          uvx --python 3.12 pip-audit==2.10.1 --disable-pip --no-deps -r audit-requirements.txt
      - run: uv run pytest
      - run: uv run ruff check src tests scripts mcpb
      - run: uv run ruff format --check src tests scripts mcpb
      - run: uv run python scripts/check_release.py
      - name: Require release notes before publishing
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            test -s "docs/release-notes-${GITHUB_REF_NAME#v}.md"
          fi
      - run: uv build --out-dir dist/python
      - name: Build and validate Mac extension
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            uv run python scripts/build_mcpb.py --tag "$GITHUB_REF_NAME"
          else
            uv run python scripts/build_mcpb.py
          fi
      - run: uv run python scripts/check_mcpb.py dist/mcpb --server-wheel dist/python
      - name: Verify compatibility with the already installed 0.1.2 launcher
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release download v0.1.2 --repo flin-agency/flin-bigquery-mcp --pattern 'flin-bigquery-mcp-0.1.2-macos.mcpb' --dir compatibility-bundle
          printf '%s  %s\n' '1905fd0197777729a8e0b36d1e56504519b7b4bd7cf0cdf64e36643de76e76d9' 'compatibility-bundle/flin-bigquery-mcp-0.1.2-macos.mcpb' | shasum -a 256 -c -
          uv run python scripts/check_mcpb.py compatibility-bundle --installed-bundle --server-wheel dist/python
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: python-dist
          path: dist/python/*
          if-no-files-found: error
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: mac-extension
          path: dist/mcpb/*
          if-no-files-found: error
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: installed-mac-extension
          path: compatibility-bundle/*.mcpb
          if-no-files-found: error
  publish-pypi:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/flin-bigquery-mcp
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: python-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
  publish-github:
    needs: [build, publish-pypi]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: python-dist
          path: release-assets
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: mac-extension
          path: release-assets
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: installed-mac-extension
          path: compatibility-bundle
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: '3.12'
      - run: uv sync --locked --extra dev
      - name: Verify published server through the unchanged installer
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: uv run python scripts/check_mcpb.py release-assets --expected-server-version "${RELEASE_TAG#v}"
      - name: Verify installed launcher receives the new PyPI server
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: uv run python scripts/check_mcpb.py compatibility-bundle --installed-bundle --expected-server-version "${RELEASE_TAG#v}"
      - name: Publish release downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          (cd release-assets && sha256sum *.mcpb *.whl *.tar.gz > SHA256SUMS)
          gh release create "$RELEASE_TAG" release-assets/* --verify-tag --title "$RELEASE_TAG" --notes-file "docs/release-notes-${RELEASE_TAG#v}.md"
