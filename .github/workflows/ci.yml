name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test-and-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --extra dev
      - run: uv run pytest
      - run: uv run ruff check src tests scripts mcpb
      - run: uv run ruff format --check src tests scripts mcpb
      - run: uv build
      - run: uv run python scripts/check_release.py
      - run: uv run python scripts/build_mcpb.py
        if: matrix.os == 'macos-latest' && matrix.python == '3.12'
      - run: uv run python scripts/check_mcpb.py dist/mcpb
        if: matrix.os == 'macos-latest' && matrix.python == '3.12'
