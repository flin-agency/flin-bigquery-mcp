name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test-and-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel, windows-latest]
        python: ['3.10', '3.12']
        include:
          - os: macos-15
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --extra dev
      - name: Audit locked dependencies
        shell: bash
        run: |
          uv export --locked --no-dev --no-emit-project --format requirements-txt --output-file audit-requirements.txt --quiet
          uvx --python "${{ matrix.python }}" pip-audit==2.10.1 --disable-pip --no-deps -r audit-requirements.txt
      - run: uv run pytest
      - run: uv run ruff check src tests scripts mcpb
      - run: uv run ruff format --check src tests scripts mcpb
      - run: uv build --out-dir dist/python
      - run: uv run python scripts/check_release.py
      - run: uv run python scripts/build_mcpb.py
        if: startsWith(matrix.os, 'macos-15') && matrix.python == '3.12'
      - run: uv run python scripts/check_mcpb.py dist/mcpb --server-wheel dist/python
        if: startsWith(matrix.os, 'macos-15') && matrix.python == '3.12'
