[build-system]
requires = ["hatchling>=1.26.0"]
build-backend = "hatchling.build"

[project]
name = "flin-bigquery-mcp"
version = "0.1.0"
description = "MCP server for exploring BigQuery and running bounded read-only SQL queries."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "flin GmbH", email = "flin@flin.agency" }]
keywords = ["mcp", "bigquery", "google-cloud", "claude"]
dependencies = [
  "mcp>=1.6.0,<2",
  "google-cloud-bigquery>=3.30.0,<4",
  "google-auth>=2.40.0,<3",
  "google-auth-oauthlib>=1.2.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1.2.2", "ruff>=0.11", "tomli>=2; python_version < '3.11'"]

[project.scripts]
flin-bigquery-mcp = "flin_bigquery_mcp.server:main"

[project.urls]
Homepage = "https://github.com/flin-agency/flin-bigquery-mcp"
Repository = "https://github.com/flin-agency/flin-bigquery-mcp"
Issues = "https://github.com/flin-agency/flin-bigquery-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/flin_bigquery_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
